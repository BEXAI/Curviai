      <stop offset="0" stop-color="#FF512F"/>
      <stop offset="0.5" stop-color="#DD2476"/>
      <stop offset="1" stop-color="#3A1C71"/>
    </linearGradient>
  </defs>
  <rect x="20" y="40" width="560" height="220" rx="40" fill="url(#g)"/>
</svg>
