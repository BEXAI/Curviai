name: CI

# Render deploys main only after every check on the commit passes
# (render.yaml autoDeployTrigger: checksPass, dashboard "After CI Checks Pass").
# A red, cancelled or missing run here therefore holds the deploy back.
# See docs/LAUNCH_CHECKLIST.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Pull requests group by branch, so a new push cancels the superseded run.
  # Pushes to main group by commit, so no run on main is ever cancelled or
  # skipped and every commit gets a result Render can act on.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Workspace packages plus the root e2e specs and playwright.config.ts.
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
