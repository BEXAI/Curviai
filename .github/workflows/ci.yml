name: CI

# Render deploys main only after every check on the commit passes
# (render.yaml autoDeployTrigger: checksPass, dashboard "After CI Checks Pass").
# A red, cancelled or missing run here therefore holds the deploy back.
# See docs/LAUNCH_CHECKLIST.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Pull requests group by branch, so a new push cancels the superseded run.
  # Pushes to main group by commit, so no run on main is ever cancelled or
  # skipped and every commit gets a result Render can act on.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high
      - name: Scan committed files with Gitleaks
        continue-on-error: true
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          mkdir "$RUNNER_TEMP/curvi-source-scan"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/curvi-source-scan" --exclude='.env*'
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/curvi-source-scan" --config "$GITHUB_WORKSPACE/.gitleaks.toml" --redact=100 --no-banner
      - run: pnpm lint
      # Workspace packages plus the root e2e specs and playwright.config.ts.
      - run: pnpm typecheck
      - run: pnpm test

  # PHASE_20 P20-03: ledger races on a real Postgres 17 (the PGlite suites
  # run on one connection). The suite creates its own database, applies
  # every migration and drops it; without TEST_DATABASE_URL it is skipped.
  ledger-race:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @curvi/db exec vitest run src/ledger-race.pg.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The billing store's grant and clawback races, through DbBillingStore.
      - run: pnpm --filter @curvi/web exec vitest run src/lib/billing/ledger-race.pg.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
