# Render Blueprint for Curvi.ai
# Mirrors the dashboard service: project Curvi.ai / Production / web service "Curviai".
# The service was created manually in the dashboard; this file keeps the config in
# source control and lets Render recreate it via Blueprints if needed.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: Curviai
    runtime: node
    repo: https://github.com/BEXAI/Curviai
    branch: main
    region: oregon
    # Standard compute plan (legacy name Standard): 1 CPU, 2 GB RAM, $25 a month
    # on the founder's Render dashboard (2026-10-01). Paid instances never spin
    # down, so idle time no longer kills packs. The plan is the founder's call
    # (it costs money); see docs/LAUNCH_CHECKLIST.md, Render plan upgrade.
    plan: 1c-2g
    # && so a failed install stops the build instead of building on a broken tree.
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    # Render routes traffic to a new deploy only once this returns 2xx, and
    # restarts an instance that fails it for 60 seconds. It returns 503 when
    # the database fails before the instance has passed a whole check once
    # (boot readiness), while the database is behind this build's migrations,
    # and while draining. After that first pass, a database failure answers
    # 200 with "ok":false, so a database blip never restarts a running
    # instance; the uptime monitor alerts on the body.
    # The hand made dashboard service does not follow this file: set the path
    # in the dashboard only after batch 1 is live (docs/LAUNCH_CHECKLIST.md,
    # Render health check path), since older code has no /api/health.
    healthCheckPath: /api/health
    # Seconds between SIGTERM and SIGKILL (Render default 30, max 300). The
    # inline pack runner drains within CURVI_SHUTDOWN_GRACE_MS (default 20000)
    # and then settles unfinished jobs, so this must stay above that grace.
    maxShutdownDelaySeconds: 300
    # Deploy only after the GitHub Actions CI checks pass on the commit
    # (replaces the deprecated autoDeploy: true). The dashboard service was
    # created by hand, so set the same thing there: Settings, Auto-Deploy,
    # After CI Checks Pass. See docs/LAUNCH_CHECKLIST.md.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://curvi.ai
      # Packs the inline runner runs at once; the rest wait in order. 2 on the
      # 2 GB plan (1 on 512 MB, 3 on 4 GB). Raise it only while Render's memory
      # graph stays well below the limit with that many packs running
      # (docs/LAUNCH_CHECKLIST.md, Render plan upgrade).
      - key: CURVI_INLINE_PACK_CONCURRENCY
        value: "2"
      # Values are set in the Render dashboard, never committed. sync: false makes
      # Render prompt for them when a Blueprint first creates the service; it
      # ignores them for an existing service. Every variable below is described
      # in docs/LAUNCH_CHECKLIST.md, Environment variables added in batch 1.
      # Optional: how long a shutdown waits for running packs before settling
      # them (default 20000). Only raise it (for example to 240000) once
      # maxShutdownDelaySeconds is confirmed at 300 on the live service, or
      # SIGKILL lands first.
      - key: CURVI_SHUTDOWN_GRACE_MS
        sync: false
      # Optional: wall clock cap per inline pack run in milliseconds (default
      # 1500000, 25 minutes; at most 1740000, below the 30 minute stale run
      # reconciler). A pack past it is settled and its slot freed.
      - key: CURVI_INLINE_PACK_MAX_RUN_MS
        sync: false
      # Optional: 1 turns on Stripe Tax in Checkout, only once tax registrations
      # exist in Stripe (docs/STRIPE_SETUP.md).
      - key: STRIPE_TAX_ENABLED
        sync: false
      # Where the daily provider spend alert and hard stop notice go (needs
      # RESEND_API_KEY). Unset: the alert only reaches the server log.
      - key: FOUNDER_ALERT_EMAIL
        sync: false
      # Sender for those alerts, on a domain verified in Resend. Default
      # "Curvi Alerts <alerts@curvi.ai>", which needs curvi.ai verified.
      - key: FOUNDER_ALERT_FROM
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_PRIVATE
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # One Stripe price id per paid tier and cadence, plus the two top ups
      # from packages/pipeline/src/seed/credits.ts.
      - key: STRIPE_PRICE_STARTER_MONTHLY
        sync: false
      - key: STRIPE_PRICE_STARTER_ANNUAL
        sync: false
      - key: STRIPE_PRICE_GROWTH_MONTHLY
        sync: false
      - key: STRIPE_PRICE_GROWTH_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_AGENCY_MONTHLY
        sync: false
      - key: STRIPE_PRICE_AGENCY_ANNUAL
        sync: false
      - key: STRIPE_PRICE_TOPUP_100
        sync: false
      - key: STRIPE_PRICE_TOPUP_500
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: TRIGGER_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BFL_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_KEY
        sync: false
