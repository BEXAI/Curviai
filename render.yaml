  - type: cron
    name: curvi-tick
    runtime: docker
    repo: https://github.com/BEXAI/Curviai
    branch: main
    region: oregon
    plan: 0.5c-512mb
    autoDeployTrigger: checksPass
    schedule: "*/10 * * * *"
    dockerfilePath: ./ops/cron/Dockerfile
    dockerContext: .
    dockerCommand: /usr/local/bin/curvi-tick
    envVars:
      - fromGroup: curvi-common
      - key: HEALTHCHECKS_TICK_URL
        sync: false
