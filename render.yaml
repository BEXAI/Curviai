# Production Blueprint reference. Applying it is a separate founder operation.
# Before adoption: turn Blueprint Auto Sync off, compare Generate Blueprint,
# precreate curvi-common with the EXISTING CRON_SECRET, and inspect the preview
# for no new/suffixed resources or overwritten values. See LAUNCH_CHECKLIST.
# sync:false is service-only; Render ignores it inside environment groups.
# Existing generated values are retained; a new installation gets a new secret.
envVarGroups:
  - name: curvi-common
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://curvi.ai
      - key: NODE_ENV
        value: production
      - key: CRON_SECRET
        generateValue: true

services:
  - type: web
    name: Curviai
    runtime: node
    repo: https://github.com/BEXAI/Curviai
    branch: main
    region: oregon
    plan: 1c-2g
    # Keep build tools and scope the larger heap to Render's separate build instance.
    buildCommand: pnpm install --frozen-lockfile --prod=false && NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--max-old-space-size=4096" pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 300
    # Current user-approved policy: deploy main only after CI passes.
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: curvi-common
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BFL_API_KEY
        sync: false
      - key: BILLING_EMAIL_FROM
        sync: false
      - key: CLIENT_IP_HEADER
        sync: false
      - key: CLIENT_IP_PROXY_SECRET
        sync: false
      - key: CSP_ENFORCE
        sync: false
      - key: CURVI_ALLOW_DEMO_GENERATION
        sync: false
      - key: CURVI_INLINE_PACK_CONCURRENCY
        value: "2"
      - key: CURVI_INLINE_PACK_MAX_RUN_MS
        sync: false
      - key: CURVI_LINK_SECRET
        sync: false
      - key: CURVI_POSTAL_ADDRESS
        sync: false
      - key: CURVI_PROVIDER_CANARY_ENABLED
        sync: false
      - key: CURVI_SHOT_CONCURRENCY
        sync: false
      - key: CURVI_SHUTDOWN_GRACE_MS
        sync: false
      - key: CURVI_TEMPLATE_FONT_FILE
        sync: false
      - key: DAILY_SPEND_HARD_STOP_USD
        sync: false
      - key: DATABASE_URL
        sync: false
